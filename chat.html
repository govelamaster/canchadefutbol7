<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cotiza tu cancha — Sportmaster</title>
<style>
  html,body{margin:0;height:100%;min-height:100dvh;
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(900px 500px at 80% -10%, rgba(19,157,69,.35), transparent 60%),
               linear-gradient(135deg,#0a7a2e 0%, #0b0d0c 100%);
    color:#fff;}
  .splash{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
  .splash .logo-box{background:#fff;display:inline-block;padding:14px 22px;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.3);margin-bottom:22px}
  .splash .logo-box img{height:54px;display:block}
  .splash h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
  .splash p{opacity:.82;font-size:15px;margin:0 0 24px}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .reopen{margin-top:22px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a7a2e;
    border:none;font-weight:800;font-size:15px;padding:14px 24px;border-radius:999px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25)}
</style>
</head>
<body>
  <div class="splash">
    <div>
      <div class="logo-box"><img src="/assets/sportmaster-m-xico-pasto-sin-f7aaa128-240.png" alt="Sportmaster México"></div>
      <h1>Cotiza tu cancha deportiva</h1>
      <p>Tu asesor se está abriendo…</p>
      <div class="spinner" id="sp"></div>
      <div><button class="reopen" id="reopen" style="display:none" onclick="abrirChat()">Abrir mi cotización →</button></div>
    </div>
  </div>

  <!-- mismo bot del sitio; se auto-protege contra doble carga -->
  <script src="/chatbot.js" defer></script>
  <script>
    function abrirChat(){ if (window.Cot && Cot.open) { try{ Cot.open(); }catch(e){} } }
    var tries = 0;
    (function waitBot(){
      tries++;
      if (window.Cot && Cot.open){
        abrirChat();
        var sp = document.getElementById('sp'); if(sp) sp.style.display='none';
        var rb = document.getElementById('reopen'); if(rb) rb.style.display='inline-flex';
        return;
      }
      if (tries < 60) setTimeout(waitBot, 150);
      else { var sp=document.getElementById('sp'); if(sp) sp.style.display='none'; var rb=document.getElementById('reopen'); if(rb) rb.style.display='inline-flex'; }
    })();
  </script>
</body>
</html>
