<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cotiza tu cancha — Sportmaster</title>
<style>
  html,body{margin:0;height:100%;min-height:100dvh;
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(900px 520px at 80% -10%, rgba(19,157,69,.40), transparent 60%),
               linear-gradient(135deg,#0a7a2e 0%, #07210f 100%);}
  /* fallback mínimo si el bot tardara en cargar (normalmente ni se ve) */
  .fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
  .fallback .sp{width:30px;height:30px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== EMBEBER EL CHAT EN EL CENTRO (sobrescribe el widget de esquina) ===== */
  #cot-launcher{display:none !important;}            /* sin burbuja lateral */
  #cot-panel{
    position:fixed !important;
    top:50% !important; left:50% !important; right:auto !important; bottom:auto !important;
    transform:translate(-50%,-50%) !important;
    width:min(460px, 94vw) !important; max-width:none !important;
    height:min(660px, 90vh) !important; max-height:90vh !important;
    border-radius:22px !important;
    box-shadow:0 30px 90px rgba(0,0,0,.45) !important;
    animation:none !important;
  }
  /* página dedicada: sin botón de cerrar (no hay a dónde "salir") */
  #cot-panel .cot-header .close{display:none !important;}

  @media(max-width:600px){
    #cot-panel{
      inset:0 !important; top:0 !important; left:0 !important;
      transform:none !important;
      width:100vw !important; height:100dvh !important; max-height:100dvh !important;
      border-radius:0 !important;
    }
  }
</style>
</head>
<body>
  <div class="fallback" id="fallback">
    <div>
      <div class="sp"></div>
    </div>
  </div>

  <!-- mismo bot del sitio; se auto-protege contra doble carga -->
  <script src="/chatbot.js" defer></script>
  <script>
    function abrirChat(){ if (window.Cot && Cot.open) { try{ Cot.open(); }catch(e){} return true; } return false; }
    var tries = 0, fb = document.getElementById('fallback');
    (function waitBot(){
      tries++;
      if (abrirChat()){ if(fb) fb.style.display = 'none'; return; }
      if (tries < 80) setTimeout(waitBot, 120);
      else if (fb) {
        // último recurso: link para abrir manualmente (raro que se llegue aquí)
        fb.innerHTML = '<a href="javascript:abrirChat()" style="color:#fff;font-weight:800;font-size:16px;background:rgba(255,255,255,.15);padding:14px 24px;border-radius:999px;text-decoration:none">Abrir mi cotización →</a>';
      }
    })();
  </script>
</body>
</html>
