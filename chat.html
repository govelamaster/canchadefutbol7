<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cotiza tu cancha — Sportmaster</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;min-height:100dvh;
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(900px 520px at 80% -10%, rgba(19,157,69,.40), transparent 60%),
               linear-gradient(135deg,#0a7a2e 0%, #07210f 100%);}

  .wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:16px 14px;gap:14px;}
  .brand{flex:0 0 auto;text-align:center}
  .brand .logo-box{background:#fff;display:inline-block;padding:12px 20px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
  .brand .logo-box img{height:42px;display:block}

  /* host donde se EMBEBE el chatbot */
  #chatHost{flex:1 1 auto;width:min(480px,100%);min-height:0;display:flex;max-height:720px}

  .sp{width:30px;height:30px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== EMBEBER el chatbot en el flujo (sobrescribe el widget flotante) ===== */
  #cot-launcher{display:none !important;}
  #cot-panel{
    position:static !important; transform:none !important; inset:auto !important;
    flex:1 1 auto !important; align-self:stretch !important;
    width:100% !important; max-width:none !important;
    height:auto !important; max-height:none !important; min-height:0 !important;
    border-radius:20px !important;
    box-shadow:0 24px 70px rgba(0,0,0,.40) !important;
    animation:none !important;
  }
  #cot-panel .cot-header .close{display:none !important;} /* página dedicada: sin cerrar */

  @media(max-width:600px){
    .wrap{padding:12px 10px 10px;gap:10px;justify-content:flex-start}
    .brand .logo-box{padding:9px 16px}
    .brand .logo-box img{height:34px}
    #chatHost{width:100%;max-height:none}
    #cot-panel{border-radius:16px !important;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="logo-box"><img src="/assets/sportmaster-m-xico-pasto-sin-f7aaa128-240.png" alt="Sportmaster México"></span>
    </div>
    <div id="chatHost"><div class="sp" id="sp"></div></div>
  </div>

  <!-- mismo bot del sitio; se auto-protege contra doble carga -->
  <script src="/chatbot.js" defer></script>
  <script>
    function embedChat(){
      var panel = document.getElementById('cot-panel');
      var host  = document.getElementById('chatHost');
      if (panel && host && panel.parentElement !== host) {
        var sp = document.getElementById('sp'); if (sp) sp.remove();
        host.appendChild(panel);   // mueve el chat al centro de la página
      }
    }
    var tries = 0;
    (function start(){
      tries++;
      if (window.Cot && Cot.open) {
        try { Cot.open(); } catch(e){}
        embedChat();
        return;
      }
      if (tries < 80) setTimeout(start, 120);
    })();
  </script>
</body>
</html>
