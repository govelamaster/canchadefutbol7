<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Diagrama del precio por m2 del pasto sintetico para cancha de futbol: rango aproximado de 250 a 350 MXN por m2 instalado, que incluye pasto deportivo, instalacion, lineas, arena silica y caucho; no incluye la base de obra civil">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#139d45"/>
      <stop offset="1" stop-color="#0a7a2e"/>
    </linearGradient>
    <style>
      .t{font-family:'Inter',Arial,sans-serif;}
      .h{font-weight:900;fill:#0b1410;}
      .mut{font-weight:700;fill:#5f6964;}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#f5f7f5"/>
  <text class="t h" x="56" y="68" font-size="34">Pasto sintético para cancha de futbol: precio por m²</text>
  <text class="t mut" x="56" y="102" font-size="19">Qué incluye cada metro cuadrado instalado · México 2026</text>

  <!-- Big price -->
  <g transform="translate(56,150)">
    <rect width="430" height="220" rx="20" fill="url(#g2)"/>
    <text class="t" x="32" y="60" font-size="15" font-weight="900" fill="rgba(255,255,255,.85)" letter-spacing="2">PRECIO APROXIMADO</text>
    <text class="t" x="32" y="135" font-size="74" font-weight="900" fill="#fff">$250–$350</text>
    <text class="t" x="32" y="172" font-size="20" font-weight="800" fill="rgba(255,255,255,.92)">MXN por m² · pasto instalado</text>
    <text class="t" x="32" y="200" font-size="14" font-weight="700" fill="rgba(255,255,255,.8)">Sistema deportivo estándar · cotización por proyecto</text>
  </g>

  <!-- What's included per m2 -->
  <g transform="translate(520,150)">
    <rect width="624" height="220" rx="18" fill="#fff" stroke="#e4e9e5"/>
    <text class="t mut" x="28" y="44" font-size="13" letter-spacing="2">CADA M² INCLUYE</text>
    <g font-size="16.5" class="t">
      <text class="h" x="28" y="84">✓ Pasto sintético deportivo</text>
      <text class="h" x="330" y="84">✓ Instalación profesional</text>
      <text class="h" x="28" y="120">✓ Líneas de juego</text>
      <text class="h" x="330" y="120">✓ Arena sílica</text>
      <text class="h" x="28" y="156">✓ Caucho deportivo</text>
      <text class="h" x="330" y="156">✓ Adhesivos y cepillado</text>
    </g>
    <rect x="28" y="176" width="568" height="30" rx="8" fill="#fff7e6" stroke="#ffd98a"/>
    <text class="t" x="44" y="196" font-size="13.5" font-weight="900" fill="#5e4406">No incluye la base (obra civil): la realiza el contratista local.</text>
  </g>

  <!-- Factors -->
  <g transform="translate(56,400)">
    <text class="t mut" x="0" y="0" font-size="13" letter-spacing="2">EL PRECIO POR M² SUBE O BAJA SEGÚN</text>
    <g font-size="15" class="t h">
      <text x="0" y="38">• Tipo de fibra (monofilamento / fibrilado / híbrido)</text>
      <text x="430" y="38">• Altura y densidad del pasto</text>
      <text x="800" y="38">• Rellenos deportivos</text>
      <text x="0" y="70">• Medidas y superficie total</text>
      <text x="430" y="70">• Líneas y trazos de juego</text>
      <text x="800" y="70">• Ciudad y logística</text>
    </g>
  </g>

  <text class="t mut" x="56" y="560" font-size="15">Ejemplo cancha futbol 7 (~1,500 m²): 1,500 × $250–$350 = $375,000 – $525,000 MXN aprox. · No incluye base ni IVA.</text>
  <text class="t mut" x="56" y="600" font-size="13" opacity=".8">Sportmaster México · canchadefutbol7.mx</text>
</svg>
